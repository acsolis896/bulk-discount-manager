# $liveCollectionIds comes from the `liveCollectionIds` key of the discount's
# function-configuration metafield (see [extensions.input.variables] in
# shopify.extension.toml). Shopify refuses to run a Function when a list variable has
# more than 100 entries, so only sets that are matched by collection carry this key and
# the app caps it at 100. It is null for every other discount, and inAnyCollection then
# falls back to its default [].
query CartLinesDiscountsGenerateRunInput($liveCollectionIds: [ID!]) {
  cart {
    buyerIdentity {
      customer {
        id
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            productType
            inAnyCollection(ids: $liveCollectionIds)
          }
        }
      }
    }
  }
  presentmentCurrencyRate
  localization {
    country {
      isoCode
    }
  }
  enteredDiscountCodes {
    code
    rejectable
  }
  discount {
    metafield(namespace: "$app", key: "function-configuration") {
      value
    }
  }
}
