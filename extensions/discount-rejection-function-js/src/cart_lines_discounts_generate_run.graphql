# $collectionIds comes from the discount's function-configuration metafield (see
# [extensions.input.variables] in shopify.extension.toml). It is null for discounts
# that have no collectionIds, and inAnyCollection then falls back to its default [].
query CartLinesDiscountsGenerateRunInput($collectionIds: [ID!]) {
  cart {
    buyerIdentity {
      customer {
        id
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            productType
            inAnyCollection(ids: $collectionIds)
          }
        }
      }
    }
  }
  localization {
    country {
      isoCode
    }
  }
  enteredDiscountCodes {
    code
    rejectable
  }
  discount {
    metafield(namespace: "$app", key: "function-configuration") {
      value
    }
  }
}
