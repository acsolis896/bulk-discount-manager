api_version = "2026-01"

[[extensions]]
name = "t:name"
handle = "discount-rejection-function-js"
type = "function"
uid = "28ea1b1b-4d37-b8bb-c209-b76d1fd74cedd898fa04"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  # Feeds the query variable $liveCollectionIds from this metafield's top-level key of the same name.
  # (Not collectionIds: old configs can hold over 100 collections, and Shopify refuses to run the
  # Function for any list variable over 100 entries.)
  [extensions.input.variables]
  namespace = "$app"
  key = "function-configuration"

  [extensions.ui.paths]
  create = "/app/discounts/new"
  details = "/app/discounts/:id"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
